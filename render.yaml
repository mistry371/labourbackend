services:
  # ── NestJS Backend ──────────────────────────────────────────────────────────
  - type: web
    name: labourbackend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: labourdb
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: labourredis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: AI_SERVICE_URL
        value: https://labourai.onrender.com
      - key: PLATFORM_FEE_PERCENT
        value: "15"
      - key: OTP_EXPIRY_MINUTES
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: GMAIL_USER
        value: servstackstechnologies@gmail.com
      - key: GMAIL_PASS
        value: fvgxbdfmegfuecwp

  # ── FastAPI AI Service ───────────────────────────────────────────────────────
  - type: web
    name: labourai
    runtime: python
    rootDir: ai-services
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: REDIS_URL
        fromService:
          name: labourredis
          type: redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Redis ────────────────────────────────────────────────────────────────────
  - type: redis
    name: labourredis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  - name: labourdb
    plan: free
    databaseName: labourplatform
